<!doctype html>
<html lang="he" dir="rtl">

  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale/user-scalable: capping zoom fails WCAG 1.4.4
         and the Israeli IS 5568 accessibility standard. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>INFINIX Simulator — סימולטור אימון מכירות</title>
    <meta
      name="description"
      content="סימולטור אימון מכירות בעברית: תרגול התנגדויות וטכניקות סגירה, משוב מיידי אחרי כל תשובה ומעקב ביצועים לאורך זמן." />
    <meta name="theme-color" content="#f2f1ed" />

    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon.svg" />

    <!-- Open Graph / social previews.
         The canonical and og:url are absolute because a share target
         has no page context to resolve a relative path against; they
         point at the production domain regardless of which preview
         deployment served the page. -->
    <link rel="canonical" href="https://simulatur.infinix.org.il/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:site_name" content="INFINIX Simulator" />
    <meta property="og:url" content="https://simulatur.infinix.org.il/" />
    <meta property="og:title" content="INFINIX Simulator — סימולטור אימון מכירות" />
    <meta
      property="og:description"
      content="תרגול התנגדויות וטכניקות סגירה, משוב מיידי ומעקב ביצועים." />
    <meta name="twitter:card" content="summary" />

    <!-- Editorial type system.
         Frank Ruhl Libre is a Hebrew serif drawn for setting text, so
         it carries headlines the way a printed masthead does; Assistant
         is the neutral grotesque underneath it; IBM Plex Mono holds
         every figure, which is what keeps columns of scores and timers
         aligned. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;800;900&family=Assistant:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; text-align: center; font-family: sans-serif">
        כדי להשתמש ב-INFINIX Simulator יש לאפשר JavaScript בדפדפן.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
